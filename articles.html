---
layout: default
title: Articles
permalink: /articles.html
---

<section class="post-list article-list">
  {% assign articles = site.posts | where: "category", "articles" | reverse %}
  {% for post in articles %}
    <article class="post-preview">
      <h2>
        <a href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </h2>

      <p class="post-date">
        {{ post.date | date: "%B %d, %Y" }}
      </p>

      {% if post.image %}
        <a href="{{ post.url | relative_url }}">
          <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
        </a>
      {% endif %}

      <p class="post-description">
        {{ post.description }}
      </p>
    </article>
  {% endfor %}
</section>
